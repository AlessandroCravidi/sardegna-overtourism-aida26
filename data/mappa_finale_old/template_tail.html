<script>
"use strict";
const DATA=JSON.parse(document.getElementById('embedded-data').textContent), MONTHS=DATA.meta.months, YEARS=DATA.meta.years;
const WEIGHTS=DATA.meta.seasonal_weights, A=DATA.meta.normalization_anchors;
const $=id=>document.getElementById(id); let month=(new Date().getMonth()+1), year=YEARS[YEARS.length-1], map, markers=new Map(), geo;
function norm(v,cap){return v==null?null:Math.max(0,Math.min(1,Math.min(v,cap)/cap))}
function calcScore(c,r){
  const ns=[norm(r.densita_turistica,A.densita_turistica),norm(r.intensita_turistica,A.intensita_turistica),norm(r.densita_ricettiva,A.densita_ricettiva),norm(r.utilizzazione_lorda,A.utilizzazione_lorda)];
  const av=ns.filter(v=>v!==null); if(av.length<2||r.presenze<=0||r.overtourism==null||r.overtourism>=r.p75_overtourism)return {...r,eligible:false,rawScore:0,ns};
  const size=c.population<1000?1.3:c.population<3000?1.15:c.population<5000?1.05:1;
  const infra=c.beds===0?.3:c.beds<=50?1:c.beds<=200?.85:.6;
  const quality=(c.coastal?1.3:1)*size*infra;
  const seasonal=r.seasonal_adjustment||0;
  return {...r,eligible:true,rawScore:(1-r.overtourism)*quality*(1+seasonal),ns};
}
function color(s){return s>70?'#176b50':s>50?'#48a868':s>30?'#d6b63f':s>10?'#cb6015':'#b94439'}
function rec(c,r){let x=[];if(1-r.overtourism>.65)x.push('pressione turistica contenuta');if(c.coastal)x.push('posizione costiera');if(c.population<3000)x.push('piccolo centro');if(c.beds<=50)x.push('ospitalità intima');if(r.seasonal_adjustment>0.15)x.push('stagione favorevole');return x.slice(0,3).join(' · ')||'scoperta autentica da esplorare'}
function fmt(v,d=2){return v==null?'n.d.':Number(v).toLocaleString('it-IT',{maximumFractionDigits:d})}
function rowFor(c){return c.monthly.find(r=>r.year===year&&r.month===month)}
function popup(c,r,score){const labels=['Densità turistica','Intensità turistica','Densità ricettiva','Utilizzazione lorda'];const vals=[r.densita_turistica,r.intensita_turistica,r.densita_ricettiva,r.utilizzazione_lorda];return `<div class="popup"><h3>${c.name}</h3><div class="sub">${c.coastal?'Costa':'Entroterra'} · ${r.eligible?'eleggibile come gemma':'fuori soglia di eleggibilità'}</div><div class="kv"><div><span>Popolazione</span>${fmt(c.population,0)}</div><div><span>Superficie</span>${fmt(c.area_kmq,1)} km²</div><div><span>Posti letto</span>${fmt(c.beds,0)}</div><div><span>Presenze mese</span>${fmt(r.presenze,0)}</div></div><div class="ind">${labels.map((l,i)=>`<div class="indrow"><span>${l}</span><div class="track"><div class="fill" style="width:${(r.norms[i]||0)*100}%"></div></div><b>${fmt(vals[i],i===1?3:1)}</b></div>`).join('')}</div><div class="bigscore"><span>Indice overtourism<br><small>Gemme nascoste</small></span><strong>${fmt(r.overtourism*100,1)} · ${fmt(score,1)}</strong></div><p style="font-size:10.5px;line-height:1.35;margin:10px 0 0;color:#587080"><b>Perché?</b> ${rec(c,r)}.</p></div>`}
function markerIcon(s,rank){const size=Math.max(7,Math.min(21,7+s*.13));return L.divIcon({className:'',html:`<div class="marker-dot ${rank&&rank<=10?'pulse':''}" style="width:${size}px;height:${size}px;background:${color(s)};opacity:${s?Math.max(.38,Math.min(1,.42+s/100)):.22}"></div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})}
function render(){const all=[];DATA.comuni.forEach(c=>{const original=rowFor(c);const r=calcScore(c,original);all.push({c,r});});const eligible=all.filter(x=>x.r.eligible).sort((a,b)=>b.r.rawScore-a.r.rawScore||a.c.name.localeCompare(b.c.name));const max=eligible[0]?.r.rawScore||1;eligible.forEach((x,i)=>{x.r.displayScore=x.r.rawScore/max*100;x.r.displayRank=i+1});all.forEach(x=>{if(!x.r.eligible){x.r.displayScore=0;x.r.displayRank=null}});const top=eligible.slice(0,15);$('count').textContent=`${eligible.length} eleggibili · p75 ${fmt(originalP75(all),2)}`;$('rankings').innerHTML=top.map(({c,r},i)=>`<article class="card" data-code="${c.code}"><div class="rank">${i+1}</div><div class="cardtop"><span class="place">${c.name}</span><span class="score">${fmt(r.displayScore,1)}/100</span></div><div class="why">${rec(c,r)}</div><div class="bars">${r.norms.map(v=>`<i class="bar" style="width:${Math.max(3,(v||0)*100)}%"></i>`).join('')}</div><div class="meta"><span>${c.coastal?'COSTA':'ENTROTERRA'}</span><span>${r.gem_rank?`rank dataset ${r.gem_rank}`:''}</span></div></article>`).join('')||'<div style="padding:20px;color:#6d7e83;font-size:12px">Nessuna località eleggibile per questa selezione.</div>';
  $('rankings').querySelectorAll('.card').forEach(el=>el.onclick=()=>{const m=markers.get(Number(el.dataset.code));if(m){map.setView(m.getLatLng(),10,{animate:true});m.openPopup()}});
  all.forEach(({c,r})=>{const s=r.displayScore;let m=markers.get(c.code);if(!m){m=L.marker([c.lat,c.lng],{icon:markerIcon(s,r.displayRank),title:c.name}).addTo(map);m.bindTooltip(`${c.name} · ${fmt(s,1)}/100`,{direction:'top',offset:[0,-5]});m.bindPopup(popup(c,r,s),{maxWidth:340});markers.set(c.code,m)}m.setIcon(markerIcon(s,r.displayRank));m.setTooltipContent(`<b>${c.name}</b><br>Gemme: ${fmt(s,1)}/100`);m.setPopupContent(popup(c,r,s));if($('topOnly').checked){if(s>0&&s>=top[14]?.r.displayScore)m.addTo(map);else map.removeLayer(m)}else m.addTo(map)});
}
function originalP75(all){const x=all.map(o=>o.r.overtourism).filter(v=>v!=null).sort((a,b)=>a-b);return x[Math.min(x.length-1,Math.ceil(.75*x.length)-1)]||0}
function init(){MONTHS.forEach((m,i)=>$('month').add(new Option(m,i+1)));YEARS.forEach(y=>$('year').add(new Option(y,y)));$('month').value=month;$('year').value=year;$('month').onchange=e=>{month=+e.target.value;render()};$('year').onchange=e=>{year=+e.target.value;render()};$('topOnly').onchange=render;map=L.map('map',{zoomControl:false,center:[40,9],zoom:8,minZoom:7});L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);geo=L.geoJSON(DATA.region,{style:{color:'#1a5276',weight:2,opacity:.8,fillColor:'#48c9b0',fillOpacity:.07}}).addTo(map);map.fitBounds(geo.getBounds(),{padding:[25,25]});render();setTimeout(()=>{$('loading').style.display='none';map.invalidateSize()},250)}
init();
</script></body></html>
